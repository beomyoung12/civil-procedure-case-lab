<header class="top"><a class="brand" href="#library"><span class="brand-icon">民</span><span>민사소송법<small>사례와 공통법리</small></span></a><nav aria-label="공부 화면"><button data-view="laws">반복 법리 모아보기</button><button data-view="library">단원별 문제</button><button data-view="classes">수업 문제</button></nav><button id="records-open" class="quiet">저장·내보내기</button></header>

<dialog id="records"><form method="dialog"><h2>내 답안과 공부기록</h2><p>이 브라우저에 자동 저장됩니다. 다른 컴퓨터에서는 기록 파일을 가져오세요.</p><p id="record-summary"></p><div class="tools"><button id="export" type="button">기록 내보내기</button><label class="button">기록 가져오기<input id="import" type="file" accept=".json,application/json" hidden></label></div><p class="small">이전 연습실의 기록은 그대로 보존되어 있습니다. 새 화면의 답안과 공부기록은 따로 저장합니다.</p><button id="reset" type="button" class="danger">새 화면의 기록 초기화</button><button value="close" class="quiet">닫기</button></form></dialog>
<dialog id="zoom"><div class="zoom-toolbar"><strong id="zoom-title">원문 확대</strong><button id="zoom-close">닫기</button></div><div id="zoom-content"></div></dialog>
